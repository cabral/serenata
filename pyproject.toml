[project]
name = "serenata"
version = "0.1.0"
description = "Anomaly detection pipeline for EU public procurement notices (TED/eForms)"
readme = "README.md"
authors = [{ name = "Felipe B. Cabral", email = "felipe.benites@gmail.com" }]
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.12"
# httpx is BSD-3-Clause (ADR-0002), pyarrow is Apache-2.0 and duckdb is MIT
# (ADR-0001, which names them as the Parquet writer and the query engine). All
# three are AGPL-3.0 compatible, and tests/test_constraints.py checks that
# against installed metadata every run.
dependencies = [
    "duckdb>=1.5.5",
    "httpx>=0.27",
    "pyarrow>=25.0.1",
]

[project.urls]
Repository = "https://github.com/cabral/serenata"

[project.scripts]
serenata = "serenata.cli:main"

[dependency-groups]
# Development tooling only; none of this ships with the distributed package.
# All permissive and AGPL-3.0 compatible, and tests/test_constraints.py checks
# that on every run rather than trusting this comment. duckdb was here until the
# first classifier needed SQL over the dataset, which is the move ADR-0001
# anticipated; it is a runtime dependency now.
dev = [
    "mypy>=1.13",
    "pip-audit>=2.7",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.8",
]
# The incoming project (ADR-0014), in a group of its own rather than smuggled
# into `dev`, because it is neither a development tool nor a dependency of this
# package: it is the other project sharing this repository until the handover
# finishes. Named and default-enabled so that one `uv sync` still gives you
# everything, and one `pytest` still runs both suites.
crony = ["crony-eu"]

[tool.uv]
default-groups = ["dev", "crony"]

[tool.uv.workspace]
members = ["crony-eu"]

[tool.uv.sources]
crony-eu = { workspace = true }

[build-system]
requires = ["uv_build>=0.8.0,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Flat layout: the package lives at the repository root, not under src/.
module-root = ""

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import sorting
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
    "RUF", # ruff-specific rules
]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["serenata", "tools/merge_guard.py", "crony-eu/src/crony_eu"]
# Two projects, one checker. `crony_eu` is under `crony-eu/src/`, which is not
# on the path mypy infers from the file list, so it is told where the package
# root is rather than left to guess from the directory name (which is not a
# legal module name).
mypy_path = "crony-eu/src"

# pyarrow ships no type information. The alternative to this override is an
# ignore comment on every import of it, which says the same thing in more
# places; our own use of it stays typed either way.
[[tool.mypy.overrides]]
module = ["pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
# Both projects' suites, from one command. Each tree keeps its own conftest and
# its own offline guard: `tests/` refuses a socket unless a test is marked
# `contract`, `crony-eu/tests/` unless it is marked `live`.
testpaths = ["tests", "crony-eu/tests"]
# Coverage is measured on every run and enforced only in CI (see
# .github/workflows/ci.yml, which passes --cov-fail-under=95). With the floor
# here, running one test file reported a failing build at 20% coverage, which
# taught everyone — human and assistant — to reach for --no-cov and lose the
# report entirely. A gate that trains people to disable it is worse than no
# gate. The floor is a rot detector, not a ratchet: the suite sits at 99%, and
# 95 leaves room to add a stage without a red build while still catching one
# that arrives untested.
# `-m "not contract"` keeps the live TED tests out of the default run: the
# suite's offline promise is enforced by a socket guard in tests/conftest.py,
# and those tests are the one deliberate exception to it. Run them with
# `uv run pytest -m contract`; CI runs them weekly, not on every push.
# Include the standalone read-only controller; coverage is not evidence of
# GitHub enforcement, real-data verification or a deployed security boundary.
addopts = "-ra --cov=serenata --cov=tools.merge_guard --cov=crony_eu --cov-report=term-missing -m 'not contract and not live'"
markers = [
    "contract: reaches the live TED service; excluded from the default run",
    "live: reaches a live French open data source; excluded from the default run",
]
