[project]
name = "serenata"
version = "0.1.0"
description = "Anomaly detection pipeline for EU public procurement notices (TED/eForms)"
readme = "README.md"
authors = [{ name = "Felipe B. Cabral", email = "felipe.benites@gmail.com" }]
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.12"
# httpx is BSD-3-Clause, compatible with AGPL-3.0 (ADR-0002).
dependencies = ["httpx>=0.27"]

[project.urls]
Repository = "https://github.com/cabral/serenata"

[project.scripts]
serenata = "serenata.cli:main"

[dependency-groups]
# Development tooling only; none of this ships with the distributed package.
# All permissive and AGPL-3.0 compatible, and tests/test_constraints.py checks
# that on every run rather than trusting this comment.
dev = [
    "mypy>=1.13",
    "pip-audit>=2.7",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.8.0,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Flat layout: the package lives at the repository root, not under src/.
module-root = ""

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import sorting
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
    "RUF", # ruff-specific rules
]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["serenata"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The coverage floor is a rot detector, not a ratchet: the suite currently sits
# at 99% with every fetch module at 100%, and 95 leaves room to add a stage
# without a red build while still catching a stage that arrives untested.
addopts = "-ra --cov=serenata --cov-report=term-missing --cov-fail-under=95"
