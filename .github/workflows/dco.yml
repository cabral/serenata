name: DCO

# Every commit in a pull request must carry a `Signed-off-by` trailer: the
# submitter's certification, under the Developer Certificate of Origin, that
# they have the right to contribute the work under AGPL-3.0. The reasoning,
# including what the trailer means on a patch written with an assistant, is in
# docs/adr/0009-contribution-provenance.md.
#
# Scoped to the commits the pull request adds, never to history. 65 of the 66
# commits that existed when this was introduced carry no sign-off, and
# rewriting published history to fix that would buy nothing. The rule starts
# here and applies forward.

on:
  pull_request:

permissions:
  contents: read

jobs:
  sign-off:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # The check compares the base against the head, so it needs both.
          fetch-depth: 0
      - name: Check every commit is signed off
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # BEGIN DCO CHECK (exercised by tests/test_workflows.py)
          set -euo pipefail

          # Event values enter via env, never shell interpolation. Refuse
          # malformed object IDs and fail closed if either commit is missing.
          for sha in "$BASE" "$HEAD"; do
            if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Invalid pull request commit ID."
              exit 1
            fi
            git rev-parse --verify "$sha^{commit}" > /dev/null
          done

          # Preserve the project's merge-commit exemption; still check every
          # non-merge commit introduced through either parent.
          commits=$(git rev-list --no-merges "$BASE..$HEAD" --)
          unsigned=0
          for sha in $commits; do
            # Do not parse or log subjects: tabs could spoof a column, and
            # contributor text must not become runner workflow commands.
            trailers=$(git show --no-patch \
              --format='%(trailers:key=Signed-off-by,valueonly=true)' "$sha" --)
            if [[ ! "$trailers" =~ [^[:space:]] ]]; then
              printf 'Missing Signed-off-by trailer: %.10s\n' "$sha"
              unsigned=1
            fi
          done

          if [[ "$unsigned" == 0 ]]; then
            echo "Every commit in this pull request is signed off."
            exit 0
          fi

          cat <<'MESSAGE'

          The Developer Certificate of Origin (https://developercertificate.org)
          asks whoever submits a patch to certify they have the right to
          contribute it under this project's licence. Add the trailer with:

              git rebase --signoff origin/main

          and force-push the branch. To stop having to remember it:

              git config core.hooksPath .githooks

          CONTRIBUTING.md explains what the trailer means on a patch written
          with an assistant. docs/adr/0009-contribution-provenance.md has the
          reasoning.
          MESSAGE
          exit 1
          # END DCO CHECK
