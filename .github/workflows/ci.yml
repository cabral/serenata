name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      # Both run on Node 24. They were on runtimes GitHub had already begun
      # forcing onto it, so CI was green only because of that forcing.
      # setup-uv is pinned to an exact version rather than a major because it
      # stopped publishing a moving major tag after v7 — `@v10` resolves to
      # nothing — which makes bumping it a deliberate step rather than a
      # silent one.
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      # Runs the constraint gates in tests/test_constraints.py alongside the
      # rest of the suite. The coverage floor lives here rather than in
      # pyproject.toml so that running a subset of the suite locally is not a
      # failing build; see the comment there.
      - name: Test
        run: uv run pytest --cov-fail-under=95
