name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      # Runs the constraint gates in tests/test_constraints.py alongside the
      # rest of the suite. The coverage floor lives here rather than in
      # pyproject.toml so that running a subset of the suite locally is not a
      # failing build; see the comment there.
      - name: Test
        run: uv run pytest --cov-fail-under=95
