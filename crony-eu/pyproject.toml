[project]
name = "crony-eu"
version = "0.1.0"
description = "Links between office holders, companies and public money, checked by a person"
readme = "README.md"
authors = [{ name = "Felipe B. Cabral", email = "felipe.benites@gmail.com" }]
license = "AGPL-3.0-only"
requires-python = ">=3.12"
# Three dependencies, all of them already in the repository's other project and
# already licence-checked on every test run: duckdb is MIT, httpx BSD-3-Clause,
# pyarrow Apache-2.0. ADR-0005 is why there is no fourth: typer, rich and
# jinja2 were specified in CLAUDE.md and the standard library covers what phase
# 1 asks of them.
dependencies = [
    "duckdb>=1.5.5",
    "httpx>=0.27",
    "pyarrow>=25.0.1",
]

[project.urls]
Repository = "https://github.com/cabral/serenata"

[project.scripts]
crony = "crony_eu.cli:main"

[build-system]
requires = ["uv_build>=0.8.0,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# src layout, unlike the repository's other project, which is flat. Keeping this
# tree self-contained is what makes moving it to its own repository a move
# rather than an untangling (ADR-0014).
module-root = "src"
module-name = "crony_eu"
