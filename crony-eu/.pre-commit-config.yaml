# Local hooks only: they run the project's own locked tool versions through uv.
repos:
  - repo: local
    hooks:
      - id: no-data-in-repo
        name: no data in the repository
        entry: uv run python scripts/check_no_data.py
        language: system
        pass_filenames: true
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy (src)
        entry: uv run mypy src
        language: system
        pass_filenames: false
        files: ^src/
